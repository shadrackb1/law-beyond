<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160">
  <rect width="720" height="160" fill="#0D1117"/>
  <text x="40" y="36" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#8B949E">study streak</text>
  <!-- streak bars -->
  <g>
    <rect x="40" y="55" width="28" height="70" rx="4" fill="#1F6FEB" opacity="0.35"/>
    <rect x="80" y="55" width="28" height="70" rx="4" fill="#1F6FEB" opacity="0.5"/>
    <rect x="120" y="55" width="28" height="70" rx="4" fill="#1F6FEB" opacity="0.7"/>
    <rect x="160" y="55" width="28" height="70" rx="4" fill="#1F6FEB">
      <animate attributeName="height" values="70;40;70" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="55;85;55" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="55" width="28" height="70" rx="4" fill="#21262D"/>
    <rect x="240" y="55" width="28" height="70" rx="4" fill="#21262D"/>
  </g>
  <!-- planner checklist -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="13">
    <text x="320" y="55" fill="#3FB950">[x] evidence notes</text>
    <text x="320" y="80" fill="#3FB950">[x] contract law ch.4</text>
    <text x="320" y="105" fill="#E6EDF3">[ ] moot draft</text>
    <rect x="318" y="95" width="12" height="12" fill="none" stroke="#1F6FEB" stroke-width="1.5">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="320" y="130" fill="#8B949E">[ ] budget review</text>
  </g>
  <text x="40" y="150" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#484F58">day 4 of 4. tomorrow is day 5.</text>
</svg>
